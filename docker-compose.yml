# Local development environment.
# Run: docker compose up -d postgres
# Web and worker services are included for convenience but are commented
# out until their Dockerfiles are exercised in CI — during early
# development, run `pnpm dev` on the host against this Postgres instead.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: acos_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: acos
      POSTGRES_PASSWORD: acos_dev_password
      POSTGRES_DB: acos_dev
    ports:
      - "5432:5432"
    volumes:
      - acos_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acos -d acos_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #   env_file: .env
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # worker:
  #   build:
  #     context: .
  #     dockerfile: apps/worker/Dockerfile
  #   env_file: .env
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  acos_postgres_dev_data:
