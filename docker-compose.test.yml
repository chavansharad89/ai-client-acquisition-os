# Ephemeral Postgres for integration tests (see tests/integration and
# packages/db). Intended to be started fresh per CI run / local test run
# and torn down after — do NOT reuse this instance for development data.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   pnpm --filter @acos/db run migrate:deploy
#   pnpm test:integration
#   docker compose -f docker-compose.test.yml down -v
version: "3.9"

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: acos_postgres_test
    restart: "no"
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: acos_test
      POSTGRES_PASSWORD: acos_test_password
      POSTGRES_DB: acos_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acos_test -d acos_test"]
      interval: 5s
      timeout: 5s
      retries: 10
